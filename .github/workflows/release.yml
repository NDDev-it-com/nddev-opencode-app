name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish attested immutable release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-supply-chain.yml@2ccb80e96f5771b6a6b4eae63a4f47e232906dc7 # 0.12.0
    with:
      version: ${{ github.ref_name }}
      package_name: nddev-opencode-app
      archive_paths: >-
        README.md LICENSE VERSION CHANGELOG.md SECURITY.md AGENTS.md .claude
        .gitignore .gds .github build cli-tools config references setups profiles
      runtime_paths: >-
        README.md LICENSE VERSION AGENTS.md .claude build cli-tools config
        references setups profiles
