name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 7 * * 1"

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: OpenSSF Scorecard
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-scorecard-json.yml@f6ea891f09653b8d449098817c8acfdb510731f6 # 0.14.0-dev
